services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      WEB_ENABLED: "1"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8082"
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./data:/app/data
    shm_size: "256mb"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
